[project]
name = "voxlab-analyzer"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "spacy>=3.8",
    "textstat>=0.7",
    "fastembed>=0.4.0",
    "faster-whisper>=1.1",
    # faster-whisper 1.2 llama a av.open(metadata_errors=...), que PyAV 16+
    # ya no acepta.
    "av>=11,<16",
    "python-multipart>=0.0.9",
]

[project.scripts]
download-model = "analyzers.download_model:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true
